<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adriana Huertas Martín | Portafolio Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-dark: #0f172a; --accent-blue: #2563eb; --bg-light: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-light); color: #1e293b; }
        .hero-section { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; padding: 60px 0; border-bottom: 4px solid var(--accent-blue); }
        .profile-img { width: 170px; height: 170px; object-fit: cover; border-radius: 50%; border: 4px solid #06b6d4; }
        .card-custom { border-radius: 14px; border: 1px solid #e2e8f0; background: white; transition: all 0.3s; }
        .card-custom:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .demo-box { background-color: #f1f5f9; border-radius: 10px; padding: 20px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <header class="hero-section text-center text-md-start">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-3 text-center mb-3 mb-md-0">
                    <img src="https://ui-avatars.com/api/?name=Adriana+Huertas&size=200&background=2563eb&color=fff" class="profile-img" alt="Adriana Huertas">
                </div>
                <div class="col-md-9">
                    <h1 class="fw-bold">Adriana Huertas Martín</h1>
                    <p class="lead">Especialista en Machine Learning, Fraud Analytics, BI & Optimización</p>
                    <p class="small text-light opacity-75"><i class="fas fa-envelope me-1"></i> adrimahuertas@gmail.com | <i class="fas fa-map-marker-alt me-1"></i> Bogotá, Colombia</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <h2 class="fw-bold mb-4">Proyectos & Simuladores Interactivos</h2>
        <div class="row g-4">
            <div class="col-md-12">
                <div class="card card-custom p-4">
                    <h4 class="fw-bold text-primary"><i class="fas fa-shield-alt me-2"></i>Detección de Fraude en Tiempo Real</h4>
                    <p class="text-muted">Simulador interactivo basado en modelo predictivo ML (XGBoost / SMOTE).</p>
                    <div class="demo-box">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Monto Transacción (USD):</label>
                                <input type="number" id="monto" class="form-control" value="1800">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Ubicación Inusual / Sospechosa:</label>
                                <select id="ubicacion" class="form-select">
                                    <option value="0">No (Ubicación habitual)</option>
                                    <option value="1">Sí (IP o País inusual)</option>
                                </select>
                            </div>
                        </div>
                        <button onclick="evaluar()" class="btn btn-primary mt-3 w-100 fw-bold">Evaluar Riesgo</button>
                        <div id="resultado" class="mt-3 p-3 rounded text-center d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function evaluar() {
            const monto = parseFloat(document.getElementById('monto').value) || 0;
            const ubi = parseInt(document.getElementById('ubicacion').value);
            const res = document.getElementById('resultado');
            res.classList.remove('d-none', 'bg-danger', 'bg-success', 'text-white');
            
            let score = (monto / 2500) * 0.5 + (ubi * 0.5);
            if (score > 0.5) {
                res.classList.add('bg-danger', 'text-white');
                res.innerHTML = `<strong>ALERTA DE FRAUDE:</strong> Score de riesgo ${(score*100).toFixed(0)}%. Acción: Bloquear.`;
            } else {
                res.classList.add('bg-success', 'text-white');
                res.innerHTML = `<strong>APROBADA:</strong> Score de riesgo ${(score*100).toFixed(0)}%. Transacción segura.`;
            }
        }
    </script>
</body>
</html>
